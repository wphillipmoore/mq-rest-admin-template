name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      versions:
        description: >-
          JSON array of language versions for the unit-test matrix.
          Default (empty) runs the full matrix.
        type: string
        default: ""
      integration-matrix:
        description: >-
          JSON array of objects for the integration-test matrix.
          Default (empty) runs the full matrix with per-version ports.
        type: string
        default: ""
      run-security:
        description: >-
          Run security scanner jobs (set to 'false' to skip).
        type: string
        default: "true"
      run-release-gates:
        description: >-
          Run release gate checks (set to 'false' to skip).
        type: string
        default: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Security and standards (shared reusable workflow)
  # ---------------------------------------------------------------------------
  security-and-standards:
    # Skip on the template repo itself — placeholders like {{CODEQL_LANGUAGE}}
    # are only meaningful after instantiation into a real repo.
    if: github.repository != 'wphillipmoore/mq-rest-admin-template'
    uses: wphillipmoore/standard-actions/.github/workflows/ci-security.yml@v1.3
    with:
      language: "{{CODEQL_LANGUAGE}}"
      # If Semgrep uses a different language name (e.g., "golang" for Go),
      # uncomment and set:
      # semgrep-language: "{{SEMGREP_LANGUAGE}}"
      run-standards: ${{ inputs.run-release-gates || 'true' }}
      run-security: ${{ inputs.run-security || 'true' }}
    permissions:
      contents: read
      security-events: write

  # ---------------------------------------------------------------------------
  # Dependency audit
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: "ci: dependency-audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # {{LANGUAGE_SETUP}}
      # Example (Python):
      #   - name: Set up Python
      #     uses: wphillipmoore/standard-actions/actions/python/setup@v1.3
      #     with:
      #       python-version: "3.14"
      # Example (Go):
      #   - name: Set up Go
      #     uses: actions/setup-go@v6
      #     with:
      #       go-version: "1.26"
      # Example (Ruby — container):
      #   container:
      #     image: ghcr.io/wphillipmoore/dev-ruby:3.4
      # Example (Java):
      #   - name: Set up Java
      #     uses: actions/setup-java@v5
      #     with:
      #       distribution: temurin
      #       java-version: "21"
      #       cache: maven

      # {{AUDIT_COMMANDS}}
      # Example (Python):
      #   - name: Install dependencies
      #     run: uv sync --frozen --group dev
      #   - name: Run pip-audit
      #     run: uv run pip-audit -r requirements.txt -r requirements-dev.txt
      # Example (Go):
      #   - name: Run govulncheck
      #     run: govulncheck ./...
      #   - name: Run license compliance check
      #     run: go-licenses check ./... --allowed_licenses=...
      # Example (Ruby):
      #   - name: Run bundle-audit
      #     run: bundle exec bundle-audit check --update
      # Example (Java):
      #   - name: Verify dependency resolution
      #     run: ./mvnw dependency:tree -B -q
      #   - name: Run license compliance check
      #     run: ./mvnw license:add-third-party ...

  # ---------------------------------------------------------------------------
  # Release gates
  # ---------------------------------------------------------------------------
  release-gates:
    name: "release: gates"
    # Skip on the template repo itself — version-command placeholders
    # only resolve after instantiation.
    if: ${{ inputs.run-release-gates != 'false' && github.repository != 'wphillipmoore/mq-rest-admin-template' }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip on non-PR events
        if: github.event_name != 'pull_request'
        run: echo "Not a pull request; skipping release gates."

      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Version divergence gate (PRs targeting develop)
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        uses: wphillipmoore/standard-actions/actions/release-gates/version-divergence@v1.3
        with:
          head-version-command: "{{HEAD_VERSION_CMD}}"
          main-version-command: "{{MAIN_VERSION_CMD}}"
          # Example (Python):
          #   head: python3 -c "import tomllib; ..."
          #   main: git show origin/main:pyproject.toml | python3 -c "..."
          # Example (Go):
          #   head: grep -oP 'Version\s*=\s*"\K[^"]+' mqrestadmin/version.go
          #   main: git show origin/main:mqrestadmin/version.go | grep -oP '...'

  # ---------------------------------------------------------------------------
  # Unit tests — matrix over language versions
  # ---------------------------------------------------------------------------
  test-and-validate:
    name: "test: unit (${{ matrix.version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.versions || '{{LANGUAGE_VERSIONS}}') }}
        # Example: '["3.12", "3.13", "3.14"]' (Python)
        # Example: '["1.25", "1.26"]' (Go)
        # Example: '["3.2", "3.3", "3.4"]' (Ruby)
        # Example: '["17", "21", "25-ea"]' (Java)

    # For container-based execution (Ruby, Python), uncomment:
    # container:
    #   image: ghcr.io/wphillipmoore/dev-{{LANGUAGE_ID}}:${{ matrix.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # For container-based jobs, add after checkout:
      # - name: Mark workspace safe for git
      #   run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # {{SETUP_STEPS}}
      # Language-specific setup (runtime, dependencies, tools)

      # {{LINT_STEPS}}
      # Language-specific linting and formatting checks

      # {{TEST_COMMAND}}
      # Language-specific test runner with coverage

  # ---------------------------------------------------------------------------
  # Integration tests — matrix over language versions with unique MQ ports
  # ---------------------------------------------------------------------------
  integration-tests:
    name: "test: integration (${{ matrix.version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.integration-matrix || '{{INTEGRATION_MATRIX_DEFAULT}}') }}
        # Each entry needs: version, project-suffix, qm1-rest-port, qm2-rest-port
        # Example (Ruby):
        #   [{"version":"3.4","project-suffix":"3-4","qm1-rest-port":"9463","qm2-rest-port":"9464"}]
        # IMPORTANT: Use unique ports per repo to avoid conflicts with parallel CI runs.
        # See docs/mq-container-local-dev.md for port allocation.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # {{LANGUAGE_SETUP}} (same as unit tests)

      - name: Setup MQ environment
        uses: wphillipmoore/mq-rest-admin-dev-environment/.github/actions/setup-mq@main
        with:
          project-name: "{{PROJECT_NAME}}-${{ matrix.project-suffix }}"
          qm1-rest-port: ${{ matrix.qm1-rest-port }}
          qm2-rest-port: ${{ matrix.qm2-rest-port }}

      # {{TEST_COMMAND}}
      # Language-specific integration test runner
      # Must set integration test env vars (e.g., MQ_REST_BASE_URL)
