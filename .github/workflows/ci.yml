name: CI - Test and Validate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-only:
    name: "ci: docs-only"
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.detect.outputs.docs-only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect docs-only changes
        id: detect
        uses: wphillipmoore/standard-actions/actions/docs-only-detect@develop

  standards-compliance:
    name: "ci: standards-compliance"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate standards
        uses: wphillipmoore/standard-actions/actions/standards-compliance@develop

  dependency-audit:
    name: "ci: dependency-audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # {{LANGUAGE_SETUP}}
      # Example (Python):
      #   - name: Set up Python
      #     uses: wphillipmoore/standard-actions/actions/python/setup@develop
      #     with:
      #       python-version: "3.14"
      # Example (Go):
      #   - name: Set up Go
      #     uses: actions/setup-go@v6
      #     with:
      #       go-version: "1.26"

      # {{AUDIT_COMMANDS}}
      # Example (Python):
      #   - name: Install dependencies
      #     run: uv sync --frozen --group dev
      #   - name: Run pip-audit
      #     run: uv run pip-audit -r requirements.txt -r requirements-dev.txt
      #   - name: Run pip-licenses
      #     run: uv run pip-licenses --allow-only="..."
      # Example (Go):
      #   - name: Install govulncheck
      #     run: go install golang.org/x/vuln/cmd/govulncheck@latest
      #   - name: Run govulncheck
      #     run: govulncheck ./...
      #   - name: Run license compliance check
      #     run: go-licenses check ./... --allowed_licenses=...

  release-gates:
    name: "release: gates"
    runs-on: ubuntu-latest
    steps:
      - name: Skip on non-PR events
        if: github.event_name != 'pull_request'
        run: echo "Not a pull request; skipping release gates."

      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Version divergence gate (PRs targeting develop)
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        uses: wphillipmoore/standard-actions/actions/release-gates/version-divergence@develop
        with:
          head-version-command: "{{HEAD_VERSION_CMD}}"
          main-version-command: "{{MAIN_VERSION_CMD}}"
          # Example (Python):
          #   head: python3 -c "import tomllib; ..."
          #   main: git show origin/main:pyproject.toml | python3 -c "..."
          # Example (Go):
          #   head: grep -oP 'Version\s*=\s*"\K[^"]+' pkg/version.go
          #   main: git show origin/main:pkg/version.go | grep -oP '...'

  test-and-validate:
    name: "test: unit"
    runs-on: ubuntu-latest
    needs: docs-only
    strategy:
      matrix:
        # {{LANGUAGE_VERSIONS}}
        # Example (Python): python-version: ["3.12", "3.13", "3.14"]
        # Example (Go):     go-version: ["1.25", "1.26"]
        version: ["placeholder"]

    steps:
      - name: Docs-only short-circuit
        if: needs.docs-only.outputs.docs-only == 'true'
        run: echo "Docs-only changes detected; skipping test-and-validate."

      - name: Checkout code
        if: needs.docs-only.outputs.docs-only != 'true'
        uses: actions/checkout@v6

      - name: Fetch base branch for version checks
        if: github.event_name == 'pull_request' && needs.docs-only.outputs.docs-only != 'true'
        run: git fetch origin ${{ github.base_ref }} --depth=1

      # {{SETUP_STEPS}}
      # Language-specific setup (runtime, dependencies, tools)

      # {{LINT_STEPS}}
      # Language-specific linting and formatting checks

      # {{TEST_COMMAND}}
      # Language-specific test runner with coverage

  codeql:
    name: "security: codeql"
    runs-on: ubuntu-latest
    needs: docs-only
    permissions:
      security-events: write
    steps:
      - name: Docs-only short-circuit
        if: needs.docs-only.outputs.docs-only == 'true'
        run: echo "Docs-only changes detected; skipping CodeQL."

      - name: Checkout code
        if: needs.docs-only.outputs.docs-only != 'true'
        uses: actions/checkout@v6

      - name: Run CodeQL analysis
        if: needs.docs-only.outputs.docs-only != 'true'
        uses: wphillipmoore/standard-actions/actions/security/codeql@develop
        with:
          language: "{{CODEQL_LANGUAGE}}"
          # python, go, java, ruby, etc.

  trivy:
    name: "security: trivy"
    runs-on: ubuntu-latest
    needs: docs-only
    permissions:
      security-events: write
    steps:
      - name: Docs-only short-circuit
        if: needs.docs-only.outputs.docs-only == 'true'
        run: echo "Docs-only changes detected; skipping Trivy."

      - name: Checkout code
        if: needs.docs-only.outputs.docs-only != 'true'
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scan
        if: needs.docs-only.outputs.docs-only != 'true'
        uses: wphillipmoore/standard-actions/actions/security/trivy@develop
        with:
          scan-type: fs

  semgrep:
    name: "security: semgrep"
    runs-on: ubuntu-latest
    needs: docs-only
    permissions:
      security-events: write
    steps:
      - name: Docs-only short-circuit
        if: needs.docs-only.outputs.docs-only == 'true'
        run: echo "Docs-only changes detected; skipping Semgrep."

      - name: Checkout code
        if: needs.docs-only.outputs.docs-only != 'true'
        uses: actions/checkout@v6

      - name: Run Semgrep SAST scan
        if: needs.docs-only.outputs.docs-only != 'true'
        uses: wphillipmoore/standard-actions/actions/security/semgrep@develop
        with:
          language: "{{SEMGREP_LANGUAGE}}"
          # python, golang, ruby, java, etc.

  integration-tests:
    name: "test: integration"
    runs-on: ubuntu-latest
    needs: docs-only
    steps:
      - name: Docs-only short-circuit
        if: needs.docs-only.outputs.docs-only == 'true'
        run: echo "Docs-only changes detected; skipping integration tests."

      - name: Checkout code
        if: needs.docs-only.outputs.docs-only != 'true'
        uses: actions/checkout@v6

      # {{LANGUAGE_SETUP}} (same as dependency-audit)

      - name: Setup MQ environment
        if: needs.docs-only.outputs.docs-only != 'true'
        uses: wphillipmoore/mq-rest-admin-dev-environment/.github/actions/setup-mq@main
        with:
          project-name: "{{PROJECT_NAME}}"

      # {{TEST_COMMAND}}
      # Example (Python):
      #   - name: Run integration tests
      #     if: needs.docs-only.outputs.docs-only != 'true'
      #     run: |
      #       MQ_SKIP_LIFECYCLE=1 \
      #       PYMQREST_RUN_INTEGRATION=1 \
      #       uv run pytest -m integration
      # Example (Go):
      #   - name: Run integration tests
      #     if: needs.docs-only.outputs.docs-only != 'true'
      #     run: |
      #       MQ_SKIP_LIFECYCLE=1 \
      #       MQ_REST_ADMIN_GO_RUN_INTEGRATION=1 \
      #       go test -race -count=1 -tags=integration ./...
